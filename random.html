<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamTalk - Random Chat</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f0f14;
      color:white;
      padding:16px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
      gap:10px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      -webkit-background-clip:text;
      color:transparent;
    }

    .back{
      text-decoration:none;
      color:white;
      background:#1c1f2e;
      padding:10px 14px;
      border-radius:12px;
      font-size:14px;
    }

    .status-card{
      background:#1c1f2e;
      border-radius:16px;
      padding:16px;
      margin-bottom:14px;
    }

    .status{
      font-size:15px;
      color:#cfcfcf;
      margin:0 0 6px 0;
    }

    .room{
      font-size:13px;
      color:#8f90a6;
      margin:0;
      word-break:break-word;
    }

    .chat-box{
      background:#1c1f2e;
      border-radius:16px;
      padding:12px;
      height:52vh;
      overflow-y:auto;
      margin-bottom:14px;
      box-shadow:0 4px 15px rgba(0,0,0,0.35);
    }

    .message{
      max-width:78%;
      padding:12px 14px;
      border-radius:16px;
      margin:8px 0;
      font-size:15px;
      line-height:1.4;
      word-wrap:break-word;
    }

    .me{
      margin-left:auto;
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      color:white;
      border-bottom-right-radius:6px;
    }

    .other{
      margin-right:auto;
      background:#2a2f45;
      color:white;
      border-bottom-left-radius:6px;
    }

    .system{
      margin:8px auto;
      text-align:center;
      font-size:13px;
      color:#9ca3af;
      max-width:100%;
    }

    .input-wrap{
      display:flex;
      gap:10px;
      margin-bottom:12px;
    }

    input{
      flex:1;
      border:none;
      outline:none;
      border-radius:14px;
      padding:15px;
      font-size:16px;
      background:#1c1f2e;
      color:white;
    }

    button{
      border:none;
      border-radius:14px;
      padding:15px 18px;
      font-size:15px;
      color:white;
      background:linear-gradient(90deg,#7c3aed,#ec4899);
    }

    .actions{
      display:flex;
      gap:10px;
    }

    .actions button{
      flex:1;
    }

    .secondary{
      background:#2a2f45;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">StreamTalk</div>
    <a class="back" href="index.html">Back</a>
  </div>

  <div class="status-card">
    <p class="status" id="statusText">Connecting...</p>
    <p class="room" id="roomText">Room: loading...</p>
  </div>

  <div class="chat-box" id="messages"></div>

  <div class="input-wrap">
    <input id="messageInput" type="text" placeholder="Type a message...">
    <button id="sendBtn">Send</button>
  </div>

  <div class="actions">
    <button class="secondary" id="skipBtn">Skip</button>
    <button class="secondary" id="clearBtn">Clear</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://PASTE_YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "PASTE_YOUR_PROJECT",
      storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
      messagingSenderId: "PASTE_YOUR_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const statusText = document.getElementById("statusText");
    const roomText = document.getElementById("roomText");
    const messages = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const skipBtn = document.getElementById("skipBtn");
    const clearBtn = document.getElementById("clearBtn");

    const myId = "user_" + Math.random().toString(36).slice(2,10);
    let roomId = null;
    let listeningRef = null;
    let joined = false;

    function addMessage(text, type){
      const div = document.createElement("div");
      div.className = type === "system" ? "system" : "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function clearMessages(){
      messages.innerHTML = "";
    }

    function setStatus(text){
      statusText.textContent = text;
    }

    function setRoom(text){
      roomText.textContent = "Room: " + text;
    }

    function startListening(room){
      if(listeningRef){
        listeningRef.off();
      }

      listeningRef = db.ref("rooms/" + room + "/messages");

      listeningRef.on("child_added", function(snapshot){
        const msg = snapshot.val();
        if(!msg) return;

        if(msg.sender === myId){
          addMessage(msg.text, "me");
        } else {
          addMessage(msg.text, "other");
        }
      });
    }

    function joinRoom(foundRoomId){
      roomId = foundRoomId;
      joined = true;
      setStatus("Connected");
      setRoom(roomId);
      clearMessages();
      addMessage("You are now connected with a stranger.", "system");
      startListening(roomId);

      db.ref("rooms/" + roomId + "/users/" + myId).set(true);
    }

    function createWaitingRoom(){
      const newRoomId = "room_" + Math.random().toString(36).slice(2,10);

      db.ref("waitingRoom").set({
        roomId: newRoomId,
        hostId: myId,
        createdAt: Date.now()
      }).then(function(){
        roomId = newRoomId;
        setStatus("Waiting for stranger...");
        setRoom(roomId);
        clearMessages();
        addMessage("Waiting for someone to join...", "system");

        db.ref("rooms/" + roomId + "/users/" + myId).set(true);

        db.ref("rooms/" + roomId + "/users").on("value", function(snapshot){
          const users = snapshot.val();
          if(!users) return;
          const count = Object.keys(users).length;
          if(count >= 2 && !joined){
            joined = true;
            setStatus("Connected");
            addMessage("A stranger joined the chat.", "system");
          }
        });
      });
    }

    function findMatch(){
      setStatus("Searching for stranger...");
      setRoom("matching...");

      db.ref("waitingRoom").once("value").then(function(snapshot){
        const waiting = snapshot.val();

        if(waiting && waiting.hostId !== myId){
          db.ref("waitingRoom").remove().then(function(){
            joinRoom(waiting.roomId);
          });
        } else {
          createWaitingRoom();
        }
      });
    }

    function sendMessage(){
      const text = messageInput.value.trim();
      if(!text || !roomId) return;

      db.ref("rooms/" + roomId + "/messages").push({
        sender: myId,
        text: text,
        time: Date.now()
      });

      messageInput.value = "";
    }

    function skipChat(){
      if(roomId){
        db.ref("rooms/" + roomId + "/users/" + myId).remove();
      }

      if(listeningRef){
        listeningRef.off();
        listeningRef = null;
      }

      joined = false;
      roomId = null;
      clearMessages();
      addMessage("You skipped the chat.", "system");
      findMatch();
    }

    sendBtn.addEventListener("click", sendMessage);

    messageInput.addEventListener("keypress", function(e){
      if(e.key === "Enter"){
        sendMessage();
      }
    });

    skipBtn.addEventListener("click", skipChat);

    clearBtn.addEventListener("click", function(){
      clearMessages();
      addMessage("Chat cleared on your screen only.", "system");
    });

    findMatch();
  </script>
</body>
</html>
