<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Talk</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#050816;
color:white;
font-family:Arial,sans-serif;
}

a{
color:#7c3aed;
font-size:18px;
text-decoration:none;
display:inline-block;
margin-bottom:20px;
}

h1{
margin:18px 0 10px;
font-size:38px;
font-weight:800;
background:linear-gradient(90deg,#7c3aed,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.status{
color:#9ca3af;
margin-bottom:10px;
font-size:16px;
}

.error{
color:#ff6b6b;
margin-bottom:10px;
white-space:pre-wrap;
min-height:20px;
}

.chatbox{
height:420px;
background:#0f172a;
border-radius:18px;
padding:14px;
overflow-y:auto;
margin-bottom:14px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
padding:12px 16px;
border-radius:18px;
max-width:75%;
word-break:break-word;
font-size:16px;
line-height:1.4;
}

.you{
align-self:flex-end;
text-align:right;
background:linear-gradient(90deg,#7c3aed,#ec4899);
color:white;
border-bottom-right-radius:6px;
}

.stranger{
align-self:flex-start;
background:#1e2a4a;
color:white;
border-bottom-left-radius:6px;
}

.system{
align-self:center;
background:transparent;
color:#94a3b8;
font-size:14px;
text-align:center;
max-width:100%;
padding:4px 8px;
}

input{
width:100%;
padding:16px;
border-radius:14px;
border:none;
outline:none;
background:#0f172a;
color:white;
margin-bottom:12px;
font-size:16px;
}

input::placeholder{
color:#9ca3af;
}

button{
width:100%;
padding:16px;
border-radius:14px;
border:none;
font-size:16px;
cursor:pointer;
margin-bottom:12px;
color:white;
}

#sendBtn{
background:linear-gradient(90deg,#7c3aed,#ec4899);
}

#reloadBtn{
background:#3a3a3a;
}

button:disabled{
opacity:0.6;
cursor:not-allowed;
}
</style>
</head>

<body>

<a href="index.html">← Back</a>

<h1>Random Talk</h1>

<div class="status" id="status">Connecting...</div>
<div class="error" id="error"></div>
<div class="status" id="roomLabel"></div>

<div id="chat" class="chatbox"></div>

<input id="messageInput" placeholder="Type a message..." />
<button id="sendBtn">Send</button>
<button id="reloadBtn">Reload Room</button>

<script>

const SUPABASE_URL="https://hcefuiaealcgixftfric.supabase.co"

const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjZWZ1aWFlYWxjZ2l4ZnRmcmljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NDkwNjksImV4cCI6MjA4ODUyNTA2OX0.5A23xPBlvI9pd1z_xqQNQFMVZeeihp5KBhl3BK8IZrg"

const ROOM="room_"+Math.random().toString(36).slice(2,8)

document.getElementById("roomLabel").textContent="Room: "+ROOM

const statusEl=document.getElementById("status")
const errorEl=document.getElementById("error")
const chatEl=document.getElementById("chat")
const inputEl=document.getElementById("messageInput")
const sendBtn=document.getElementById("sendBtn")
const reloadBtn=document.getElementById("reloadBtn")

const senderId=getOrCreateSenderId()

function getOrCreateSenderId(){
let id=sessionStorage.getItem("randomTalkSenderId")
if(!id){
id="user_"+Math.random().toString(36).slice(2,10)
sessionStorage.setItem("randomTalkSenderId",id)
}
return id
}

function setStatus(msg){
statusEl.textContent=msg
}

function setError(msg){
errorEl.textContent=msg||""
}

function clearError(){
errorEl.textContent=""
}

function packMessage(text){
return senderId+"::"+text
}

function unpackMessage(raw){

const separator="::"
const index=raw.indexOf(separator)

if(index===-1){
return{isYou:false,text:raw}
}

const msgSenderId=raw.slice(0,index)
const text=raw.slice(index+separator.length)

return{
isYou:msgSenderId===senderId,
text
}

}

function renderMessages(rows){

chatEl.innerHTML=""

if(!rows.length){
const empty=document.createElement("div")
empty.className="system"
empty.textContent="No messages yet. Say hi."
chatEl.appendChild(empty)
return
}

rows.forEach(row=>{

const parsed=unpackMessage(row.message)

const div=document.createElement("div")
div.className="message "+(parsed.isYou?"you":"stranger")
div.textContent=parsed.text

chatEl.appendChild(div)

})

chatEl.scrollTop=chatEl.scrollHeight

}

async function supabaseGet(path){

const res=await fetch(SUPABASE_URL+path,{
method:"GET",
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
Accept:"application/json"
}
})

return await res.json()

}

async function supabasePost(path,body){

await fetch(SUPABASE_URL+path,{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
Prefer:"return=representation"
},
body:JSON.stringify(body)
})

}

async function supabaseDelete(path){

await fetch(SUPABASE_URL+path,{
method:"DELETE",
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
}
})

}

async function loadMessages(){

setStatus("Loading...")

const rows=await supabaseGet(
"/rest/v1/messages?select=id,message,room,created_at&room=eq."+ROOM+"&order=created_at.asc"
)

renderMessages(rows||[])

setStatus("Connected")

}

async function sendMessage(){

const text=inputEl.value.trim()

if(!text)return

sendBtn.disabled=true

await supabasePost("/rest/v1/messages",[
{
message:packMessage(text),
room:ROOM
}
])

inputEl.value=""

await loadMessages()

sendBtn.disabled=false

}

async function reloadRoom(){

await supabaseDelete("/rest/v1/messages?room=eq."+ROOM)

await loadMessages()

}

sendBtn.addEventListener("click",sendMessage)

reloadBtn.addEventListener("click",reloadRoom)

inputEl.addEventListener("keydown",function(e){
if(e.key==="Enter")sendMessage()
})

loadMessages()

setInterval(loadMessages,2000)

</script>

</body>
</html>
