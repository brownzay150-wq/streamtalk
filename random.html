<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk Random Chat</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;display:flex;flex-direction:column;gap:12px;}
textarea{flex:1;border:none;outline:none;border-radius:12px;padding:8px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:12px;padding:6px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;margin-top:4px;}
.chat-box,.profile-card,.owner-panel,.log-panel{background:#1c1f2e;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;}
.message{padding:6px 10px;border-radius:12px;margin:4px 0;}
.me{background:#7c3aed;color:white;}
.other{background:#2a2f45;color:white;}
.system{text-align:center;color:#aaa;margin:4px 0;}
.profile-card{cursor:pointer;flex-direction:row;align-items:center;gap:8px;}
.profile-card img{width:40px;height:40px;border-radius:50%;}
.banned{opacity:.4;filter:grayscale(1);}
#ownerPanel,#logPanel,#profilesContainer{display:none;}
</style>
</head>
<body>

<h1>StreamTalk</h1>

<!-- Login -->
<div id="loginDiv">
<input id="username" placeholder="Username (with emoji)" style="padding:6px;border-radius:8px;border:none;background:#2a2f45;color:white;">
<input type="password" id="password" placeholder="Password" style="padding:6px;border-radius:8px;border:none;background:#2a2f45;color:white;">
<button id="loginBtn">Login / Register</button>
<div id="loginMsg" class="system"></div>
</div>

<!-- Profiles -->
<div id="profilesContainer"></div>

<!-- Chat -->
<div class="chat-box" id="messages"></div>
<textarea id="msg" placeholder="Type a message..." maxlength="500"></textarea>
<button id="send">Send</button>
<button id="skip">Skip</button>
<button id="report">Report</button>

<!-- Owner / Debug -->
<div id="ownerPanel" class="owner-panel">
<button onclick="toggleOwner()">Hide/Show Owner</button>
<button onclick="ownerBan()">Ban User</button>
<button onclick="ownerTimeout()">Timeout</button>
<button onclick="ownerCopyLogs()">Copy Logs</button>
<button onclick="ownerClearLogs()">Clear Logs</button>
<button onclick="ownerSelfChat()">Self-Test Chat</button>
</div>

<!-- Logs -->
<div id="logPanel" class="log-panel">
<button onclick="toggleLogs()">Hide/Show Logs</button>
<div id="logsContent"></div>
</div>

<footer>
<a href="rules.html" target="_blank">Rules</a> •
<a href="privacy.html" target="_blank">Privacy</a> •
<a href="terms.html" target="_blank">Terms</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// --- Firebase ---
const cfg={apiKey:"AIzaSyC46DQfCDl7tVUjin-PmYfQuWL2vcj8O48",authDomain:"streamtalk-fcfd5.firebaseapp.com",databaseURL:"https://streamtalk-fcfd5-default-rtdb.firebaseio.com",projectId:"streamtalk-fcfd5",storageBucket:"streamtalk-fcfd5.firebasestorage.app",messagingSenderId:"971872258888",appId:"1:971872258888:web:316fe78c5b762611d7c17d"};
firebase.initializeApp(cfg);const db=firebase.database();

// --- Globals ---
let uid=null,room=null,partner=null,logs=[],mods=[];
const badWords=["fag","faggot","nigger"];
const $=(id)=>document.getElementById(id);

// --- UI ---
const msgBox=$("messages"),input=$("msg"),profiles=$("profilesContainer");
const loginDiv=$("loginDiv"),username=$("username"),password=$("password"),loginBtn=$("loginBtn"),loginMsg=$("loginMsg");
const ownerPanel=$("ownerPanel"),logPanel=$("logPanel"),logsContent=$("logsContent");

// --- Helpers ---
function addSys(t){let d=document.createElement("div");d.className="system";d.textContent=t;msgBox.appendChild(d);msgBox.scrollTop=msgBox.scrollHeight;logs.push("[SYS] "+t);refreshLogs();}
function addMsg(t,type){let d=document.createElement("div");d.className=type;d.textContent=t;msgBox.appendChild(d);msgBox.scrollTop=msgBox.scrollHeight;logs.push(`[${type}] ${t}`);refreshLogs();}
function refreshLogs(){logsContent.innerHTML=logs.map(l=>`<div>${l}</div>`).join("");logsContent.scrollTop=logsContent.scrollHeight;}
function filterText(t){return badWords.some(w=>t.toLowerCase().includes(w))?"[blocked]":t;}
function toggleOwner(){ownerPanel.style.display=ownerPanel.style.display==="flex"?"none":"flex";}
function toggleLogs(){logPanel.style.display=logPanel.style.display==="flex"?"none":"flex";}

// --- Login ---
loginBtn.onclick=async()=>{
  let name=username.value.trim(),pass=password.value.trim();
  if(!name||!pass){loginMsg.textContent="Enter username/password";return;}
  let snap=await db.ref("users/"+name).once("value");
  if(snap.exists()&&snap.val().banned){loginMsg.textContent="You are banned";return;}
  if(!snap.exists()){await db.ref("users/"+name).set({pass:pass,banned:false,uid:"user_"+Math.random().toString(36).slice(2,8)});}
  uid=name;loginDiv.style.display="none";addSys("Logged in as "+uid);loadProfiles();
};

// --- Profiles ---
async function loadProfiles(){
  let snap=await db.ref("users").once("value");profiles.innerHTML="";
  let users=snap.val()||{};
  for(let u in users){
    let div=document.createElement("div");div.className="profile-card";if(users[u].banned)div.classList.add("banned");
    div.innerHTML=`<img src="" alt="avatar"><span>${u}</span>`;
    div.onclick=()=>addSys("Clicked "+u);
    profiles.appendChild(div);
  }
}

// --- Self-Test Chat ---
async function joinRoom(){room="room_test";partner="self_test";addSys("Connected to self");}

// --- Send ---
$("send").onclick=()=>{let t=filterText(input.value.trim());if(!t||!room)return;addMsg(t,"me");input.value="";}

// --- Skip / Report ---
$("skip").onclick=()=>addSys("Skipped");$("report").onclick=()=>addSys("Report sent");

// --- Owner Functions (Examples) ---
function ownerBan(){addSys("Owner banned "+$("target")?.value||"");}
function ownerTimeout(){addSys("Owner timeout "+$("target")?.value||"");}
function ownerMod(){addSys("Added mod "+$("target")?.value||"");}
function ownerMute(){addSys("Muted "+$("target")?.value||"");}
function ownerList(){addSys("Listing users");}
function ownerSysMsg(){addSys("System msg");}
function ownerFun(){addSys("Fun msg");}
function ownerCopyLogs(){navigator.clipboard.writeText(logs.join("\n"));addSys("Logs copied");}
function ownerClearLogs(){logs=[];refreshLogs();addSys("Logs cleared");}
function ownerSelfChat(){joinRoom();}

// --- Boot ---
