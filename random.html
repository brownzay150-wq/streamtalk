<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk Chat</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;display:flex;flex-direction:column;gap:20px;}
.chat-box{background:#1c1f2e;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;}
textarea{flex:1;border:none;outline:none;border-radius:14px;padding:10px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:14px;padding:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;}
.message{padding:8px 12px;border-radius:14px;margin:4px 0;}
.me{background:#7c3aed;color:white;border-bottom-right-radius:6px;}
.other{background:#2a2f45;color:white;border-bottom-left-radius:6px;}
.system{text-align:center;color:#aaa;margin:6px 0;}
.badge-wrap{display:flex;gap:8px;margin-top:6px;}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#2a2f45;color:#cfd3ff;}
footer{text-align:center;color:#aaa;margin-top:20px;}
footer a{color:#08f;text-decoration:none;margin:0 5px;}
</style>
</head>
<body>

<h1>StreamTalk Chat</h1>

<div class="chat-box">
  <div id="status">Status: Searching...</div>
  <div id="messages"></div>
  <textarea id="msg" placeholder="Type a message..."></textarea>
  <button id="send">Send</button>
  <button id="skip">Skip</button>
  <button id="clear">Clear</button>
  <button id="report">Report</button>
  <div class="badge-wrap">
    <div id="online" class="badge">Online: 0</div>
    <div id="state" class="badge">Idle</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const cfg={apiKey:"AIzaSyC46DQfCDl7tVUjin-PmYfQuWL2vcj8O48",authDomain:"streamtalk-fcfd5.firebaseapp.com",databaseURL:"https://streamtalk-fcfd5-default-rtdb.firebaseio.com",projectId:"streamtalk-fcfd5",storageBucket:"streamtalk-fcfd5.firebasestorage.app",messagingSenderId:"971872258888",appId:"1:971872258888:web:316fe78c5b762611d7c17d"};
firebase.initializeApp(cfg);
const db=firebase.database();

const $=id=>document.getElementById(id);
const status=$("status"),messages=$("messages"),msg=$("msg"),send=$("send"),skip=$("skip"),clr=$("clear"),report=$("report"),online=$("online"),state=$("state");

let uid=sessionStorage.getItem("streamtalk_user_id")||sessionStorage.setItem("streamtalk_user_id","user_"+Math.random().toString(36).slice(2,10))||sessionStorage.getItem("streamtalk_user_id");
let room=null,partner=null,connected=false,displayed={},timer=null;

// ---------------- Firebase Presence ----------------
db.ref(".info/connected").on("value",snap=>{if(snap.val()){let p=db.ref("presence/"+uid);p.onDisconnect().remove();p.set({online:true,updatedAt:firebase.database.ServerValue.TIMESTAMP});}});
db.ref("presence").on("value",snap=>{online.textContent="Online: "+Object.keys(snap.val()||{}).length;});

// ---------------- Functions ----------------
function addSys(text){let d=document.createElement("div");d.className="system";d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;}
function addMsg(text,type){let m=document.createElement("div");m.className=type;m.textContent=text;messages.appendChild(m);messages.scrollTop=messages.scrollHeight;}
function setStatusText(t){status.textContent="Status: "+t;}

// ---------------- Match / Queue ----------------
async function tryMatch(){
  if(room||connected) return;
  setStatusText("Searching");messages.innerHTML="";addSys("Searching for stranger...");
  const w=await db.ref("waiting").once("value");const users=w.val()||{};
  const candidates=Object.entries(users).filter(([k,v])=>v.userId!==uid).sort((a,b)=>a[1].createdAt-b[1].createdAt);
  if(candidates.length){const [k,u]=candidates[0];const res=await db.ref("waiting/"+k).transaction(c=>c?null:undefined);if(res.committed)return createRoom(u.userId);}
  await db.ref("waiting").push({userId:uid,createdAt:Date.now()});
}

// ---------------- Create / Listen Room ----------------
async function createRoom(otherId){
  room="room_"+Math.random().toString(36).slice(2,10);partner=otherId;connected=true;
  await db.ref("rooms/"+room).set({users:{[uid]:true,[otherId]:true},typing:{[uid]:false,[otherId]:false}});
  await db.ref("assignments/"+otherId).set({roomId:room,partnerId:uid});
  messages.innerHTML="";displayed={};addSys("Connected to stranger");
  db.ref("rooms/"+room).on("value",snap=>{
    let val=snap.val()||{},uids=Object.keys(val.users||{}),t=val.typing||{};
    partner=uids.find(x=>x!==uid)||null;if(connected&&uids.length<=1){handleDisconnect();}
    Object.entries(val.messages||{}).forEach(([k,m])=>{if(displayed[k])return;displayed[k]=true;m.sender===uid?addMsg(m.text,"me"):addMsg(m.text,"other");});
  });
}

// ---------------- Send / Skip ----------------
send.addEventListener("click",()=>sendMsg());
msg.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
async function sendMsg(){let t=msg.value.trim();if(!t||!room||!connected)return;await db.ref("rooms/"+room+"/messages").push({sender:uid,text:t,time:Date.now()});msg.value="";db.ref("rooms/"+room+"/typing/"+uid).set(false);}
skip.addEventListener("click",async()=>{setStatusText("Skipping");await cleanup();addSys("You skipped");tryMatch();});
clr.addEventListener("click",()=>{messages.innerHTML="";displayed={};addSys("Chat cleared");});
report.addEventListener("click",()=>{if(room&&partner)db.ref("reports").push({reportedBy:uid,reportedUser:partner,roomId:room,time:Date.now()});addSys("Report submitted");});

// ---------------- Disconnect / Cleanup ----------------
async function cleanup(){
  clearTimeout(timer);
  db.ref("waiting").orderByChild("userId").equalTo(uid).once("value").then(snap=>snap.forEach(c=>c.ref.remove()));
  db.ref("assignments/"+uid).remove();
  if(room){db.ref("rooms/"+room+"/typing/"+uid).remove();db.ref("rooms/"+room+"/users/"+uid).remove();room=null;partner=null;connected=false;displayed={};}
}
function handleDisconnect(){setStatusText("Disconnected");addSys("Reconnecting...");timer=setTimeout(async()=>{await cleanup();addSys("Finding new stranger");tryMatch();},2000);}

// ---------------- Typing ----------------
msg.addEventListener("input",()=>{if(room)db.ref("rooms/"+room+"/typing/"+uid).set(msg.value.trim().length>0);});

// ---------------- Boot ----------------
tryMatch();
</script>

<footer>
  <a href="rules.html" target="_blank">Rules</a> •
  <a href="privacy.html" target="_blank">Privacy</a> •
  <a href="terms.html" target="_blank">Terms</a>
</footer>

</body>
</html>
