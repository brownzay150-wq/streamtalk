<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;display:flex;flex-direction:column;gap:16px;}
.chat-box{background:#1c1f2e;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;}
textarea{flex:1;border:none;outline:none;border-radius:12px;padding:10px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:12px;padding:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;}
.message{padding:6px 10px;border-radius:12px;margin:4px 0;}
.me{background:#7c3aed;color:white;}
.other{background:#2a2f45;color:white;}
.system{text-align:center;color:#aaa;}
.badge-wrap{display:flex;gap:8px;margin-top:6px;}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#2a2f45;color:#cfd3ff;}
footer{text-align:center;color:#aaa;margin-top:12px;}
footer a{color:#08f;text-decoration:none;margin:0 4px;}
</style>
</head>
<body>

<div class="chat-box">
  <div class="status" id="status">Status: Searching...</div>
  <div class="messages" id="messages"></div>
  <textarea id="msg" placeholder="Type a message..."></textarea>
  <div style="display:flex;gap:8px;margin-top:8px;">
    <button id="send">Send</button>
    <button id="skip">Skip</button>
    <button id="clear">Clear</button>
    <button id="report">Report</button>
  </div>
  <div class="badge-wrap">
    <div id="online" class="badge">Online: 0</div>
    <div id="statusBadge" class="badge">Idle</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// --- Firebase config ---
const cfg={
  apiKey:"AIzaSyC46DQfCDl7tVUjin-PmYfQuWL2vcj8O48",
  authDomain:"streamtalk-fcfd5.firebaseapp.com",
  databaseURL:"https://streamtalk-fcfd5-default-rtdb.firebaseio.com",
  projectId:"streamtalk-fcfd5",
  storageBucket:"streamtalk-fcfd5.firebasestorage.app",
  messagingSenderId:"971872258888",
  appId:"1:971872258888:web:316fe78c5b762611d7c17d"
};
firebase.initializeApp(cfg);
const db=firebase.database();

// --- DOM ---
const messages = document.getElementById("messages");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const skipBtn = document.getElementById("skip");
const clearBtn = document.getElementById("clear");
const reportBtn = document.getElementById("report");
const statusEl = document.getElementById("status");
const onlineEl = document.getElementById("online");
const statusBadge = document.getElementById("statusBadge");

// --- User ---
const uid = sessionStorage.getItem("streamtalk_user_id") || sessionStorage.setItem("streamtalk_user_id","user_"+Math.random().toString(36).slice(2,11)) || sessionStorage.getItem("streamtalk_user_id");
let room = null, partner = null;

// --- Filters ---
const badWords = ["fag","faggot","nigger"];
function cleanMsg(t){return badWords.some(w=>t.toLowerCase().includes(w))?"[Message removed]":t;}

// --- UI ---
function addMsg(text,type){
  const div = document.createElement("div");
  div.className = type;
  div.textContent = cleanMsg(text);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
function addSys(text){
  const div = document.createElement("div");
  div.className="system";
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
function setStatus(text){status.textContent="Status: "+text;statusBadge.textContent=text;}

// --- Presence ---
db.ref(".info/connected").on("value",snap=>{
  if(snap.val()){
    const p=db.ref("presence/"+uid);
    p.onDisconnect().remove();
    p.set({online:true,updatedAt:firebase.database.ServerValue.TIMESTAMP});
  }
});
db.ref("presence").on("value",snap=>{
  onlineEl.textContent="Online: "+Object.keys(snap.val()||{}).length;
});

// --- Matching ---
async function tryMatch(){
  setStatus("Searching");
  addSys("Searching for stranger...");
  const w = await db.ref("waiting").once("value");
  const users = w.val() || {};
  const candidate = Object.entries(users).find(([k,v])=>v.userId!==uid);
  if(candidate){
    const [k,u] = candidate;
    room = "room_"+Math.random().toString(36).slice(2,8);
    partner = u.userId;
    await db.ref("rooms/"+room).set({users:{[uid]:true,[partner]:true}});
    await db.ref("assignments/"+partner).set({roomId:room,partnerId:uid});
    await db.ref("waiting/"+k).remove();
    addSys("Connected to stranger");
    setStatus("Connected");
    startRoomListener();
  } else {
    await db.ref("waiting").push({userId:uid,createdAt:Date.now()});
  }
}

// --- Room listener ---
function startRoomListener(){
  if(!room) return;
  db.ref("rooms/"+room+"/messages").on("child_added",snap=>{
    const m = snap.val();
    if(m.sender!==uid) addMsg(m.text,"other");
  });
}

// --- Send ---
sendBtn.onclick = async ()=>{
  const t = msgInput.value.trim();
  if(!t||!room) return;
  await db.ref("rooms/"+room+"/messages").push({sender:uid,text:t});
  addMsg(t,"me");
  msgInput.value="";
}

// --- Skip / Clear / Report ---
skipBtn.onclick = async ()=>{
  addSys("You skipped");
  if(partner) await db.ref("rooms/"+room+"/messages").push({sender:uid,text:"[User skipped]"});
  room = null; partner = null;
  tryMatch();
};
clearBtn.onclick = ()=>{messages.innerHTML="";addSys("Chat cleared");};
reportBtn.onclick = async ()=>{if(room&&partner) await db.ref("reports").push({reportedBy:uid,reportedUser:partner,roomId:room,time:Date.now()});addSys("Report submitted");};

// --- Boot ---
tryMatch();
</script>

<footer>
  <a href="rules.html" target="_blank">Rules</a> •
  <a href="privacy.html" target="_blank">Privacy</a> •
  <a href="terms.html" target="_blank">Terms</a>
</footer>

</body>
</html>
