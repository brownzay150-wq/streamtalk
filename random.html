<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Talk - StreamTalk</title>

  <style>
    body{
      background:#0f0f14;
      color:white;
      font-family:Arial,sans-serif;
      margin:0;
      padding:20px;
    }

    h1{
      font-size:40px;
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      -webkit-background-clip:text;
      color:transparent;
      margin:0 0 10px 0;
    }

    .subtitle{
      color:#aaa;
      margin-bottom:14px;
    }

    .status{
      color:#9ca3af;
      font-size:14px;
      margin-bottom:14px;
      word-break:break-word;
    }

    .error{
      color:#f87171;
    }

    .success{
      color:#86efac;
    }

    .chatbox{
      background:#1c1f2e;
      padding:20px;
      border-radius:15px;
      margin-bottom:20px;
      min-height:220px;
      max-height:320px;
      overflow:auto;
    }

    .message{
      margin:10px 0;
      line-height:1.4;
      word-break:break-word;
    }

    .you{
      color:#ec4899;
    }

    .stranger{
      color:#7c3aed;
    }

    input{
      width:100%;
      box-sizing:border-box;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#111;
      color:white;
      margin-top:10px;
      margin-bottom:10px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-size:16px;
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      color:white;
    }

    .skip{
      background:#333;
    }

    a{
      color:#7c3aed;
    }

    .small{
      font-size:12px;
      color:#6b7280;
      margin-top:10px;
    }
  </style>
</head>
<body>

  <a href="index.html">← Back</a>

  <h1>Random Talk</h1>
  <p class="subtitle">Testing live chat connection.</p>

  <div id="status" class="status">Starting…</div>

  <div id="chat" class="chatbox"></div>

  <input id="msg" placeholder="Type a message...">
  <button id="sendBtn">Send</button>
  <button class="skip" id="reloadBtn">Reload Room</button>

  <div class="small">
    For testing, both browsers join the same room: <b>test_room</b>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://hcefiuiaealcgixftfric.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_5T9RDsl6x-ITyJ88HD0uyg_BPPBuLE-'

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    const chat = document.getElementById('chat')
    const msgInput = document.getElementById('msg')
    const sendBtn = document.getElementById('sendBtn')
    const reloadBtn = document.getElementById('reloadBtn')
    const statusEl = document.getElementById('status')

    const userId = 'user_' + Math.random().toString(36).slice(2,10)
    const room = 'test_room'

    function setStatus(text, type=''){
      statusEl.textContent = text
      statusEl.className = 'status ' + type
    }

    function addMessage(text, cls){
      const div = document.createElement('div')
      div.className = 'message ' + cls
      div.textContent = text
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
    }

    async function loadOldMessages(){
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .eq('room', room)
        .order('id', { ascending: true })

      if(error){
        setStatus('Load failed: ' + error.message, 'error')
        return false
      }

      chat.innerHTML = ''

      for(const row of data){
        if(row.user === userId){
          addMessage('You: ' + row.text, 'you')
        } else {
          addMessage('Stranger: ' + row.text, 'stranger')
        }
      }

      return true
    }

    async function sendMessage(){
      const text = msgInput.value.trim()
      if(!text) return

      setStatus('Sending…')

      const { error } = await supabase
        .from('messages')
        .insert([{ room: room, user: userId, text: text }])

      if(error){
        setStatus('Send failed: ' + error.message, 'error')
        return
      }

      msgInput.value = ''
      setStatus('Connected to room: ' + room, 'success')
    }

    async function boot(){
      setStatus('Connecting to Supabase…')

      const loaded = await loadOldMessages()

      if(!loaded) return

      setStatus('Connected to room: ' + room, 'success')

      supabase
        .channel('messages-live')
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'messages'
          },
          (payload) => {
            const row = payload.new
            if(row.room !== room) return

            if(row.user === userId){
              addMessage('You: ' + row.text, 'you')
            } else {
              addMessage('Stranger: ' + row.text, 'stranger')
            }
          }
        )
        .subscribe((state) => {
          console.log('Realtime status:', state)
        })
    }

    sendBtn.addEventListener('click', sendMessage)

    msgInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        sendMessage()
      }
    })

    reloadBtn.addEventListener('click', () => {
      location.reload()
    })

    boot()
  </script>

</body>
</html>
