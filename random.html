<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Talk - StreamTalk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
background:#0f0f14;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
font-size:40px;
background:linear-gradient(90deg,#7c3aed,#ec4899);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
color:#aaa;
margin-bottom:25px;
}

.chatbox{
background:#1c1f2e;
padding:20px;
border-radius:15px;
margin-bottom:20px;
height:260px;
overflow:auto;
}

.message{
margin:8px 0;
}

.you{
color:#ec4899;
}

.stranger{
color:#7c3aed;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#111;
color:white;
margin-top:10px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
background:linear-gradient(90deg,#7c3aed,#ec4899);
color:white;
}

.skip{
background:#333;
}
</style>

</head>

<body>

<a href="index.html">← Back</a>

<h1>Random Talk</h1>
<p class="subtitle">Connecting to a random user...</p>

<div id="chat" class="chatbox"></div>

<input id="msg" placeholder="Type a message...">

<button onclick="sendMessage()">Send</button>
<button class="skip" onclick="skipUser()">Skip User</button>

<script>

// 🔑 Your Supabase credentials
const SUPABASE_URL = "https://hcefiuiaealcgixftfric.supabase.co"
const SUPABASE_KEY = "sb_publishable_5T9RDsl6x-ITyJ88HD0uyg_BPPBuLE-"

// connect
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let userId = Math.random().toString(36).substring(2)
let room = "room_" + Math.floor(Math.random()*5)

const chat = document.getElementById("chat")

function addMessage(text, type){
let div = document.createElement("div")
div.className = "message " + type
div.innerText = text
chat.appendChild(div)
chat.scrollTop = chat.scrollHeight
}

async function sendMessage(){
let input = document.getElementById("msg")
if(!input.value.trim()) return

await client.from("messages").insert({
room: room,
user: userId,
text: input.value
})

addMessage("You: " + input.value, "you")
input.value = ""
}

function skipUser(){
location.reload()
}

client
.channel("chat")
.on(
"postgres_changes",
{
event: "INSERT",
schema: "public",
table: "messages"
},
payload => {

if(payload.new.user !== userId && payload.new.room === room){
addMessage("Stranger: " + payload.new.text, "stranger")
}

}
)
.subscribe()

</script>

</body>
</html>
