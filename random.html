<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Talk</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
body{
background:#0b0b14;
color:white;
font-family:sans-serif;
padding:20px;
margin:0;
}
a{
color:#7c3aed;
}
h1{
background:linear-gradient(90deg,#7c3aed,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
font-size:38px;
margin:24px 0 10px;
}
.chatbox{
height:320px;
background:#111827;
border-radius:12px;
padding:12px;
overflow:auto;
margin-bottom:12px;
}
.message{
background:#1b2540;
padding:8px 10px;
border-radius:8px;
margin-bottom:6px;
word-break:break-word;
}
input{
width:100%;
box-sizing:border-box;
padding:14px;
border-radius:10px;
border:none;
background:#111827;
color:white;
margin-bottom:10px;
font-size:16px;
}
button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:linear-gradient(90deg,#7c3aed,#ec4899);
color:white;
font-size:16px;
margin-bottom:10px;
}
.secondary{
background:#2d2d35;
}
.error{
color:#ff6b6b;
margin-bottom:10px;
white-space:pre-wrap;
}
.status{
color:#9ca3af;
margin-bottom:10px;
}
.log{
color:#cbd5e1;
font-size:14px;
background:#0f172a;
padding:10px;
border-radius:10px;
white-space:pre-wrap;
margin-bottom:12px;
}
</style>
</head>
<body>

<a href="index.html">← Back</a>

<h1>Random Talk</h1>

<div class="status" id="status">Starting...</div>
<div class="error" id="error"></div>
<div class="log" id="log">Booting...\n</div>

<div id="chat" class="chatbox"></div>

<input id="messageInput" placeholder="Type a message..." />
<button id="sendBtn">Send</button>
<button id="reloadBtn" class="secondary">Reload Room</button>

<script>
const SUPABASE_URL = "https://hcefiuiaeaelcgixftfric.supabase.co";
const SUPABASE_KEY = "sb_publishable_5T9RDsI6x-ITyJ88HD0uyg_BPPBuLE-";
const room = "test_room";

const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const logEl = document.getElementById("log");
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const reloadBtn = document.getElementById("reloadBtn");

let supabase = null;

function log(msg){
  logEl.textContent += msg + "\n";
}

function setStatus(msg){
  statusEl.textContent = msg;
  log("STATUS: " + msg);
}

function setError(msg){
  errorEl.textContent = msg || "";
  if(msg) log("ERROR: " + msg);
}

function renderMessages(rows){
  chatEl.innerHTML = "";
  rows.forEach(row => {
    const div = document.createElement("div");
    div.className = "message";
    div.textContent = row.message;
    chatEl.appendChild(div);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function loadMessages(){
  setStatus("Loading messages...");
  setError("");

  try{
    const result = await supabase
      .from("messages")
      .select("id,message,room,created_at")
      .eq("room", room)
      .order("created_at", { ascending: true });

    log("loadMessages returned");

    if(result.error){
      setError("Load error: " + result.error.message);
      setStatus("Load failed");
      return;
    }

    renderMessages(result.data || []);
    setStatus("Connected");
    log("Loaded " + (result.data ? result.data.length : 0) + " messages");
  }catch(err){
    setError("Load catch: " + err.message);
    setStatus("Load crashed");
  }
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text){
    setError("Type a message first");
    return;
  }

  setStatus("Sending...");
  setError("");
  sendBtn.disabled = true;

  try{
    const result = await supabase
      .from("messages")
      .insert([{ message: text, room: room }]);

    log("sendMessage returned");

    if(result.error){
      setError("Send error: " + result.error.message);
      setStatus("Send failed");
      sendBtn.disabled = false;
      return;
    }

    inputEl.value = "";
    setStatus("Sent. Reloading...");
    await loadMessages();
  }catch(err){
    setError("Send catch: " + err.message);
    setStatus("Send crashed");
  }

  sendBtn.disabled = false;
}

async function start(){
  try{
    setStatus("Checking Supabase library...");
    if(!window.supabase || !window.supabase.createClient){
      setError("Supabase library did not load.");
      setStatus("Startup failed");
      return;
    }

    log("Supabase library loaded");
    log("URL: " + SUPABASE_URL);
    log("Key length: " + SUPABASE_KEY.length);

    setStatus("Creating client...");
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    log("Client created");

    await loadMessages();
  }catch(err){
    setError("Startup catch: " + err.message);
    setStatus("Startup crashed");
  }
}

sendBtn.addEventListener("click", sendMessage);
reloadBtn.addEventListener("click", loadMessages);
inputEl.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    sendMessage();
  }
});

start();
</script>

</body>
</html>
