<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;}
h1{font-size:36px;text-align:center;background:linear-gradient(90deg,#7c3aed,#ec4899);-webkit-background-clip:text;color:transparent;}
.chat{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.box{background:#1c1f2e;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.txt{flex:1;border:none;outline:none;border-radius:10px;padding:6px;background:#2a2f45;color:white;resize:none;}
.btn{border:none;border-radius:10px;padding:6px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;}
.msg{padding:4px 8px;border-radius:10px;margin:2px 0;}
.me{background:#7c3aed;color:white;align-self:flex-end;}
.other{background:#2a2f45;color:white;align-self:flex-start;}
.sys{text-align:center;color:#aaa;}
.badge-wrap{display:flex;gap:6px;margin-top:4px;}
.badge{font-size:11px;padding:2px 4px;border-radius:6px;background:#2a2f45;color:#cfd3ff;}
footer{text-align:center;color:#aaa;margin-top:8px;}
footer a{color:#08f;text-decoration:none;margin:0 4px;}
</style>
</head>
<body>

<h1>StreamTalk</h1>
<div class="chat">
  <div class="box" id="box">
    <div class="status" id="status">Idle</div>
    <div class="msgs" id="msgs"></div>
    <textarea id="txt" placeholder="Type message..."></textarea>
    <div style="display:flex;gap:4px;">
      <button id="send" class="btn">Send</button>
      <button id="skip" class="btn">Skip</button>
      <button id="clr" class="btn">Clear</button>
      <button id="rep" class="btn">Report</button>
    </div>
    <div class="badge-wrap">
      <div id="online" class="badge">Online: 0</div>
      <div id="conn" class="badge">Conn: 0</div>
    </div>
  </div>
</div>

<footer>
  <a href="rules.html" target="_blank">Rules</a>•
  <a href="privacy.html" target="_blank">Privacy</a>•
  <a href="terms.html" target="_blank">Terms</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// Firebase
const cfg={apiKey:"AIzaSyC46DQfCDl7tVUjin-PmYfQuWL2vcj8O48",authDomain:"streamtalk-fcfd5.firebaseapp.com",databaseURL:"https://streamtalk-fcfd5-default-rtdb.firebaseio.com",projectId:"streamtalk-fcfd5",storageBucket:"streamtalk-fcfd5.appspot.com",messagingSenderId:"971872258888",appId:"1:971872258888:web:316fe78c5b762611d7c17d"};
firebase.initializeApp(cfg); const db=firebase.database();

// Elements
const ms=document.getElementById("msgs"),txt=document.getElementById("txt");
const status=document.getElementById("status"),online=document.getElementById("online"),conn=document.getElementById("conn");
const send=document.getElementById("send"),skip=document.getElementById("skip"),clr=document.getElementById("clr"),rep=document.getElementById("rep");

// Session
let uid=sessionStorage.getItem("uid")||sessionStorage.setItem("uid","u_"+Math.random().toString(36).slice(2,8))||sessionStorage.getItem("uid");
let room=null,partner=null,connected=false,displayed={},bad=["fag","faggot","nigger","shit","asshole","bastard","damn"];

// Helper
function add(t,c){const d=document.createElement("div");d.className=c;d.textContent=t;ms.appendChild(d);ms.scrollTop=ms.scrollHeight;}
function setSt(t){status.textContent="Status: "+t;}
function addOnline(n){online.textContent="Online: "+n;}

// Match / Queue
async function tryMatch(){
if(room||connected)return; setSt("Searching..."); add("Searching...","sys");
const w=await db.ref("waiting").once("value"); let u=w.val()||{};
let c=Object.entries(u).filter(([k,v])=>v.id!=uid); 
if(c.length){let [k,v]=c[0]; await db.ref("waiting/"+k).remove(); return createRoom(v.id);}
await db.ref("waiting").push({id:uid,time:Date.now()});
}
async function createRoom(pid){
room="r_"+Math.random().toString(36).slice(2,8); partner=pid; connected=true;
await db.ref("rooms/"+room).set({users:{[uid]:true,[pid]:true},typing:{[uid]:false,[pid]:false}});
await db.ref("assignments/"+pid).set({room:room,partner:uid});
add("Connected to stranger","sys"); setSt("Connected"); listenRoom();
}

// Listen
function listenRoom(){
if(!room)return;
db.ref("rooms/"+room).on("value",snap=>{
let v=snap.val()||{},uids=Object.keys(v.users||{}),t=v.typing||{}; partner=uids.find(x=>x!=uid)||null;
if(connected&&uids.length<=1){cleanup(); add("Partner left","sys"); setSt("Idle");}
Object.entries(v.messages||{}).forEach(([k,m])=>{if(displayed[k])return; displayed[k]=true; add(m.sender==uid?m.text:"Stranger: "+m.text,m.sender==uid?"me":"other");});
conn.textContent="Conn: "+uids.length;
});
}

// Send / Skip / Clear / Report
send.onclick=()=>{let t=txt.value.trim(); if(!t||!room||!connected)return; for(let w of bad){if(t.toLowerCase().includes(w)){alert("Bad word!"); txt.value=""; return;}} 
db.ref("rooms/"+room+"/messages").push({sender:uid,text:t}); txt.value="";}
skip.onclick=()=>{cleanup(); add("You skipped","sys"); tryMatch();}
clr.onclick=()=>{ms.innerHTML=""; displayed={}; add("Chat cleared","sys");}
rep.onclick=()=>{if(room&&partner)db.ref("reports").push({by:uid,who:partner,room:room,time:Date.now()}); add("Report submitted","sys");}

// Disconnect / Cleanup
async function cleanup(){connected=false; room=null; partner=null; await db.ref("waiting").orderByChild("id").equalTo(uid).once("value").then(s=>s.forEach(c=>c.ref.remove())); await db.ref("assignments/"+uid).remove();}

// Typing indicator
txt.addEventListener("input",()=>{if(room) db.ref("rooms/"+room+"/typing/"+uid).set(txt.value.length>0);})

// Presence
db.ref(".info/connected").on("value",s=>{if(s.val()){let p=db.ref("presence/"+uid); p.onDisconnect().remove(); p.set({online:true,time:Date.now()});}});
db.ref("presence").on("value",s=>addOnline(Object.keys(s.val()||{}).length));

// Boot
tryMatch();
</script>
</body>
</html>
