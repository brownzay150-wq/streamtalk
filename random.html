<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamTalk</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;display:flex;flex-direction:column;gap:16px;}
.chat-box{background:#1c1f2e;border-radius:16px;padding:16px;flex:1;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;}
textarea{flex:1;border:none;outline:none;border-radius:12px;padding:10px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:12px;padding:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;margin-top:6px;}
.message{padding:6px 10px;border-radius:12px;margin:4px 0;}
.me{background:#7c3aed;color:white;}
.other{background:#2a2f45;color:white;}
.system{text-align:center;color:#aaa;margin:4px 0;}
footer{margin-top:12px;text-align:center;color:#aaa;font-size:13px;}
</style>
</head>
<body>

<h1>StreamTalk Chat</h1>
<div class="chat-box" id="messages"></div>
<textarea id="msg" placeholder="Type a message..."></textarea>
<button id="send">Send</button>
<button id="skip">Skip</button>
<button id="report">Report</button>
<button id="download">Download Logs</button>

<footer>
<a href="rules.html" target="_blank">Rules</a> •
<a href="privacy.html" target="_blank">Privacy</a> •
<a href="terms.html" target="_blank">Terms</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// --- Firebase config ---
const cfg={
apiKey:"AIzaSyC46DQfCDl7tVUjin-PmYfQuWL2vcj8O48",
authDomain:"streamtalk-fcfd5.firebaseapp.com",
databaseURL:"https://streamtalk-fcfd5-default-rtdb.firebaseio.com",
projectId:"streamtalk-fcfd5",
storageBucket:"streamtalk-fcfd5.firebasestorage.app",
messagingSenderId:"971872258888",
appId:"1:971872258888:web:316fe78c5b762611d7c17d"
};
firebase.initializeApp(cfg);
const db=firebase.database();

// --- Setup user & room ---
const uid=sessionStorage.getItem("streamtalk_user_id")||sessionStorage.setItem("streamtalk_user_id","user_"+Math.random().toString(36).slice(2,8))||sessionStorage.getItem("streamtalk_user_id");
let room=null,partner=null,logs=[];

// --- UI ---
const msgBox=document.getElementById("messages"),input=document.getElementById("msg");
const sendBtn=document.getElementById("send"),skipBtn=document.getElementById("skip");
const reportBtn=document.getElementById("report"),downloadBtn=document.getElementById("download");

// --- Helpers ---
function addMsg(text,type){let m=document.createElement("div");m.className=type;m.textContent=text;msgBox.appendChild(m);msgBox.scrollTop=msgBox.scrollHeight;logs.push({text,type,time:Date.now()});}
function addSys(text){addMsg(text,"system");}
function downloadLogs(){let blob=new Blob([JSON.stringify(logs,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="logs_"+uid+".json";a.click();}

// --- Filter ---
const badWords=["fag","faggot","nigger"];
function checkText(t){return badWords.some(w=>t.toLowerCase().includes(w));}

// --- Match / chat ---
async function joinRoom(){
room="room_test";partner="self_test";
addSys("Connected to self (test mode)");
db.ref("rooms/"+room+"/messages").on("child_added",snap=>{
let m=snap.val();
if(m.sender!==uid){addMsg(m.text,"other");}
});
}

// --- Send ---
sendBtn.onclick=()=>{let t=input.value.trim();if(!t||checkText(t))return;addMsg(t,"me");db.ref("rooms/"+room+"/messages").push({sender:uid,text:t});input.value="";}
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendBtn.click();}});

// --- Skip / Report ---
skipBtn.onclick=()=>addSys("Skipped");
reportBtn.onclick=()=>addSys("Report sent");

// --- Logs ---
downloadBtn.onclick=downloadLogs;

// --- Boot ---
joinRoom();
</script>

</body>
</html>
