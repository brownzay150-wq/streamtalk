<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamTalk Random Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="index.html">← Back to Home</a>

    <h1>Random Chat</h1>
    <p class="subtitle">Talk to strangers in real time.</p>

    <div class="top-row">
      <button id="joinRandom" class="main-btn button-reset">Join Random Chat</button>
      <button id="ownerMenuBtn" class="secondary-btn button-reset">Owner Menu</button>
    </div>

    <div id="statusText" class="status">Status: Offline</div>

    <div id="chatBox" class="chat-box"></div>

    <textarea id="chatInput" placeholder="Type your message..."></textarea>

    <div class="bottom-row">
      <button id="sendBtn" class="main-btn button-reset">Send</button>
      <button id="skipBtn" class="secondary-btn button-reset">Skip</button>
      <button id="disconnectBtn" class="danger-btn button-reset">Disconnect</button>
    </div>

    <div id="ownerMenu" class="owner-panel">
      <h3>Owner Controls</h3>
      <p>This is a placeholder owner panel for now.</p>
      <ul>
        <li>Live moderation tools coming soon</li>
        <li>User reports coming soon</li>
        <li>Logs coming soon</li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
