<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Talk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
background:#0b0b14;
color:white;
font-family:sans-serif;
padding:20px;
margin:0;
}

h1{
background:linear-gradient(90deg,#7c3aed,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
font-size:38px;
}

.chatbox{
height:320px;
background:#111827;
border-radius:12px;
padding:12px;
overflow:auto;
margin-bottom:12px;
}

.message{
background:#1b2540;
padding:8px 10px;
border-radius:8px;
margin-bottom:6px;
}

input{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#111827;
color:white;
margin-bottom:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:linear-gradient(90deg,#7c3aed,#ec4899);
color:white;
font-size:16px;
margin-bottom:10px;
}

.secondary{
background:#333;
}

.status{
color:#9ca3af;
margin-bottom:10px;
}

.error{
color:#ff6b6b;
margin-bottom:10px;
}

.log{
background:#0f172a;
padding:10px;
border-radius:10px;
margin-bottom:12px;
font-size:14px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<a href="index.html">← Back</a>

<h1>Random Talk</h1>

<div class="status" id="status">Starting...</div>
<div class="error" id="error"></div>
<div class="log" id="log">Booting...\n</div>

<div id="chat" class="chatbox"></div>

<input id="messageInput" placeholder="Type a message..." />
<button id="sendBtn">Send</button>
<button id="reloadBtn" class="secondary">Reload Room</button>

<script>

const SUPABASE_URL = "https://hcefiuiaeaelcgixftfric.supabase.co";
const SUPABASE_KEY = "sb_publishable_5T9RDsI6x-ITyJ88HD0uyg_BPPBuLE-";

const room = "test_room";

const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const logEl = document.getElementById("log");
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const reloadBtn = document.getElementById("reloadBtn");

function log(msg){
logEl.textContent += msg + "\n";
}

function setStatus(msg){
statusEl.textContent = msg;
log("STATUS: " + msg);
}

function setError(msg){
errorEl.textContent = msg;
if(msg) log("ERROR: " + msg);
}

function addMessage(text){
const div = document.createElement("div");
div.className = "message";
div.textContent = text;
chatEl.appendChild(div);
}

async function loadMessages(){

setStatus("Loading messages...");

try{

const { data, error } = await supabase
.from("messages")
.select("*")
.eq("room", room)
.order("created_at", { ascending: true });

if(error){
setError(error.message);
return;
}

chatEl.innerHTML="";

data.forEach(msg=>{
addMessage(msg.message);
});

chatEl.scrollTop = chatEl.scrollHeight;

setStatus("Connected");

}catch(err){

setError(err.message);

}

}

async function sendMessage(){

const text = inputEl.value.trim();

if(!text) return;

setStatus("Sending...");

const { error } = await supabase
.from("messages")
.insert([{message:text,room:room}]);

if(error){
setError(error.message);
return;
}

inputEl.value="";

loadMessages();

}

sendBtn.onclick = sendMessage;
reloadBtn.onclick = loadMessages;

let supabase;

async function start(){

setStatus("Checking library...");

if(!window.supabase){

setError("Supabase library failed to load");
return;

}

log("Library loaded");

supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

log("Client created");

loadMessages();

}

start();

</script>

</body>
</html>
