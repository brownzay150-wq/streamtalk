<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk Test Mode</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;display:flex;flex-direction:column;gap:20px;}
.chat-container{display:flex;gap:20px;flex-wrap:wrap;}
.chat-box{background:#1c1f2e;border-radius:18px;padding:16px;min-width:300px;flex:1;display:flex;flex-direction:column;gap:10px;}
textarea{flex:1;border:none;outline:none;border-radius:14px;padding:10px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:14px;padding:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;}
.message{padding:8px 12px;border-radius:14px;margin:4px 0;}
.me{background:#7c3aed;color:white;border-bottom-right-radius:6px;}
.other{background:#2a2f45;color:white;border-bottom-left-radius:6px;}
.system{text-align:center;color:#aaa;margin:6px 0;}
</style>
</head>
<body>

<h1>StreamTalk Test Mode</h1>
<div class="chat-container">
  <!-- Chat 1 -->
  <div class="chat-box" id="chat1">
    <div class="status" id="status1">Status: Searching...</div>
    <div class="messages" id="messages1"></div>
    <textarea id="msg1" placeholder="Type a message..."></textarea>
    <button id="send1">Send</button>
    <button id="skip1">Skip</button>
    <button id="report1">Report</button>
  </div>

  <!-- Chat 2 -->
  <div class="chat-box" id="chat2">
    <div class="status" id="status2">Status: Searching...</div>
    <div class="messages" id="messages2"></div>
    <textarea id="msg2" placeholder="Type a message..."></textarea>
    <button id="send2">Send</button>
    <button id="skip2">Skip</button>
    <button id="report2">Report</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// --- Firebase config ---
const cfg={
  apiKey:"AIzaSyC46DQfCDl7tVUjin-PmYfQuWL2vcj8O48",
  authDomain:"streamtalk-fcfd5.firebaseapp.com",
  databaseURL:"https://streamtalk-fcfd5-default-rtdb.firebaseio.com",
  projectId:"streamtalk-fcfd5",
  storageBucket:"streamtalk-fcfd5.firebasestorage.app",
  messagingSenderId:"971872258888",
  appId:"1:971872258888:web:316fe78c5b762611d7c17d"
};
firebase.initializeApp(cfg);
const db=firebase.database();

// --- Chat 1 ---
const chat1={id:"user1_"+Math.random().toString(36).slice(2,8),box:"messages1",msg:"msg1",status:"status1"};
// --- Chat 2 ---
const chat2={id:"user2_"+Math.random().toString(36).slice(2,8),box:"messages2",msg:"msg2",status:"status2"};

// --- Helper ---
function addMsg(chat,text,type){const m=document.createElement("div");m.className=type;m.textContent=text;document.getElementById(chat.box).appendChild(m);}
function addSys(chat,text){const m=document.createElement("div");m.className="system";m.textContent=text;document.getElementById(chat.box).appendChild(m);}
function setStatus(chat,text){document.getElementById(chat.status).textContent="Status: "+text;}
function scroll(chat){const el=document.getElementById(chat.box);el.scrollTop=el.scrollHeight;}

// --- Simulate waiting/matching ---
async function tryMatch(chat,otherChat){
  setStatus(chat,"Searching...");
  addSys(chat,"Searching for stranger...");
  // Directly assign each other
  chat.room="room_test";
  chat.partner=otherChat.id;
  otherChat.room="room_test";
  otherChat.partner=chat.id;
  setStatus(chat,"Connected");
  setStatus(otherChat,"Connected");
  addSys(chat,"Connected to stranger");
  addSys(otherChat,"Connected to stranger");
}

// --- Send ---
function sendMessage(chat,otherChat){
  const t=document.getElementById(chat.msg).value.trim();
  if(!t) return;
  addMsg(chat,t,"me");scroll(chat);
  addMsg(otherChat,t,"other");scroll(otherChat);
  document.getElementById(chat.msg).value="";
}

// --- Button events ---
document.getElementById("send1").onclick=()=>sendMessage(chat1,chat2);
document.getElementById("send2").onclick=()=>sendMessage(chat2,chat1);

// Skip
document.getElementById("skip1").onclick=()=>{addSys(chat1,"You skipped");addSys(chat2,"Stranger skipped");};
document.getElementById("skip2").onclick=()=>{addSys(chat2,"You skipped");addSys(chat1,"Stranger skipped");};

// Report
document.getElementById("report1").onclick=()=>addSys(chat1,"Report submitted");
document.getElementById("report2").onclick=()=>addSys(chat2,"Report submitted");

// Boot
tryMatch(chat1,chat2);
</script>

</body>
</html>
