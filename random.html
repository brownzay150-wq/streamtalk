<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Talk - StreamTalk</title>

<style>
body{
background:#0f0f14;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
background:linear-gradient(90deg,#7c3aed,#ec4899);
-webkit-background-clip:text;
color:transparent;
}

.chatbox{
background:#1c1f2e;
padding:20px;
border-radius:15px;
margin-top:20px;
}

input{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
background:#111;
color:white;
}

button{
margin-top:10px;
padding:15px;
width:100%;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#7c3aed,#ec4899);
color:white;
font-size:16px;
}

.skip{
background:#333;
}
</style>

</head>

<body>

<a href="index.html">← Back</a>

<h1>Random Talk</h1>
<p>You're now chatting with a random user.</p>

<div class="chatbox">
<p><b>Stranger:</b> Hey</p>
</div>

<input placeholder="Type a message...">

<button>Send</button>
<button class="skip">Skip User</button>

</body>
</html>
