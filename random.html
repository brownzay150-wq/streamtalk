<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;display:flex;flex-direction:column;gap:12px;}
.chat-box{background:#1c1f2e;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:50vh;}
textarea{flex:1;border:none;outline:none;border-radius:12px;padding:10px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:12px;padding:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;}
.message{padding:6px 10px;border-radius:12px;margin:4px 0;word-wrap:break-word;}
.me{background:#7c3aed;color:white;align-self:flex-end;}
.other{background:#2a2f45;color:white;align-self:flex-start;}
.system{text-align:center;color:#aaa;}
.badge-wrap{display:flex;gap:8px;margin-top:6px;}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#2a2f45;color:#cfd3ff;}
</style>
</head>
<body>

<h1>StreamTalk Chat</h1>

<div class="chat-box">
  <div id="status" class="system">Searching for stranger...</div>
  <div id="messages"><div class="system">Open on two devices to test.</div></div>
  <textarea id="msg" placeholder="Type a message..." maxlength="500"></textarea>
  <div style="display:flex;gap:6px;">
    <button id="send">Send</button>
    <button id="skip">Skip</button>
    <button id="clear">Clear</button>
    <button id="report">Report</button>
  </div>
  <div class="badge-wrap">
    <div id="online" class="badge">Online: 0</div>
    <div id="statusBadge" class="badge">Idle</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// Firebase
const cfg={apiKey:"AIzaSyC46DQfCDl7tVUjin-PmYfQuWL2vcj8O48",authDomain:"streamtalk-fcfd5.firebaseapp.com",databaseURL:"https://streamtalk-fcfd5-default-rtdb.firebaseio.com",projectId:"streamtalk-fcfd5",storageBucket:"streamtalk-fcfd5.firebasestorage.app",messagingSenderId:"971872258888",appId:"1:971872258888:web:316fe78c5b762611d7c17d"};
firebase.initializeApp(cfg);
const db=firebase.database();

// Elements
const $=id=>document.getElementById(id),msgs=$("messages"),input=$("msg"),statusEl=$("status"),online=$("online"),statusBadge=$("statusBadge");
const sendBtn=$("send"),skipBtn=$("skip"),clrBtn=$("clear"),reportBtn=$("report");

// State
let uid=sessionStorage.getItem("uid")||sessionStorage.setItem("uid","user_"+Math.random().toString(36).slice(2,8))||sessionStorage.getItem("uid");
let room=null,partner=null,connected=false,displayed={};

// Helpers
const addSys=t=>{let d=document.createElement("div");d.className="system";d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
const addMsg=(t,type)=>{let m=document.createElement("div");m.className=type;m.textContent=t;msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;}
const setStatus=t=>statusEl.textContent=t;
const setBadge=t=>statusBadge.textContent=t;
const filter=t=>t.replace(/fuck|shit/gi,'***');

// Presence
db.ref(".info/connected").on("value",s=>{if(s.val()){let p=db.ref("presence/"+uid);p.onDisconnect().remove();p.set({online:true,updatedAt:firebase.database.ServerValue.TIMESTAMP});}});
db.ref("presence").on("value",s=>online.textContent="Online: "+Object.keys(s.val()||{}).length);

// Match
async function tryMatch(){
  if(connected) return;
  setStatus("Searching");addSys("Searching for stranger...");
  const w=await db.ref("waiting").once("value"),users=w.val()||{};
  const c=Object.entries(users).filter(([k,v])=>v.userId!==uid);
  if(c.length){const [k,u]=c[0];await db.ref("waiting/"+k).remove();return createRoom(u.userId);}
  await db.ref("waiting").push({userId:uid,createdAt:Date.now()});
}

// Create Room
async function createRoom(otherId){
  room="room_"+Math.random().toString(36).slice(2,8);partner=otherId;connected=true;
  await db.ref("rooms/"+room).set({users:{[uid]:true,[otherId]:true},typing:{[uid]:false,[otherId]:false}});
  await db.ref("assignments/"+otherId).set({roomId:room,partnerId:uid});
  msgs.innerHTML="";displayed={};addSys("Connected to stranger");setStatus("Connected");setBadge("Connected");listenRoom();
}

// Room listener
function listenRoom(){
  if(!room) return;
  db.ref("rooms/"+room).on("value",snap=>{
    const val=snap.val()||{},uids=Object.keys(val.users||{}),t=val.typing||{};
    partner=uids.find(x=>x!==uid)||null;
    if(connected&&uids.length<=1){handleDisconnect();}
    Object.entries(val.messages||{}).forEach(([k,m])=>{if(displayed[k])return;displayed[k]=true;m.sender===uid?addMsg(filter(m.text),"me"):addMsg(filter(m.text),"other");});
  });
}

// Send / Skip / Clear / Report
sendBtn.onclick=()=>{const t=input.value.trim();if(!t||!room||!connected)return;db.ref("rooms/"+room+"/messages").push({sender:uid,text:t,time:Date.now()});input.value="";}
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendBtn.click();}});
skipBtn.onclick=async()=>{addSys("You skipped");await cleanup();tryMatch();}
clrBtn.onclick=()=>{msgs.innerHTML="";addSys("Chat cleared");}
reportBtn.onclick=()=>{if(room&&partner)db.ref("reports").push({reportedBy:uid,reportedUser:partner,roomId:room,time:Date.now()});addSys("Report submitted");}

// Disconnect / Cleanup
async function cleanup(){
  db.ref("waiting").orderByChild("userId").equalTo(uid).once("value").then(s=>s.forEach(c=>c.ref.remove()));
  db.ref("assignments/"+uid).remove();
  if(room){db.ref("rooms/"+room+"/typing/"+uid).remove();db.ref("rooms/"+room+"/users/"+uid).remove();room=null;partner=null;connected=false;displayed={};}
}
function handleDisconnect(){setStatus("Disconnected");addSys("Stranger disconnected. Reconnecting...");setTimeout(async()=>{await cleanup();addSys("Finding new stranger");tryMatch();},1500);}

// Typing
input.addEventListener("input",()=>{if(room) db.ref("rooms/"+room+"/typing/"+uid).set(input.value.trim().length>0);});

// Boot
tryMatch();
</script>

<footer>
  <a href="rules.html" target="_blank">Rules</a> •
  <a href="privacy.html" target="_blank">Privacy</a> •
  <a href="terms.html" target="_blank">Terms</a>
</footer>

</body>
</html>
