<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamTalk Random Chat</title>
<style>
body {
  margin: 0;
  padding: 16px;
  font-family: Arial;
  background: #0f0f14;
  color: white;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-box,
.profile-card,
.owner-panel,
.log-panel {
  background: #1c1f2e;
  border-radius: 16px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 50vh;
  overflow-y: auto;
}

textarea {
  flex: 1;
  border: none;
  outline: none;
  border-radius: 12px;
  padding: 8px;
  background: #2a2f45;
  color: white;
  resize: none;
}

button {
  border: none;
  border-radius: 12px;
  padding: 6px;
  background: linear-gradient(90deg, #7c3aed, #ec4899);
  color: white;
  cursor: pointer;
  margin-top: 4px;
}

.message {
  padding: 6px 10px;
  border-radius: 12px;
  margin: 4px 0;
}

.me {
  background: #7c3aed;
  color: white;
}

.other {
  background: #2a2f45;
  color: white;
}

.system {
  text-align: center;
  color: #aaa;
  margin: 4px 0;
}

/* Owner menu, logs, and login modal */
#ownerMenu {
  display: none;
  background: #1a1d2e;
  padding: 10px;
  border-radius: 12px;
  max-height: 200px;
  overflow-y: auto;
  flex-direction: column;
  gap: 4px;
}

#liveLogs {
  display: none;
  background: #1a1d2e;
  padding: 8px;
  border-radius: 12px;
  max-height: 150px;
  overflow-y: auto;
  font-size: 12px;
  color: #cfd3ff;
}

#logsContent {
  overflow-y: auto;
}
</style>
</head>
<body>
<h1>StreamTalk Random Chat</h1>

<div class="chat-box" id="chatBox"></div>

<textarea id="chatInput" placeholder="Type your message..."></textarea>
<button id="sendBtn">Send</button>

<div id="ownerMenu" class="owner-panel">
  <p>Owner Controls</p>
</div>

<div id="liveLogs" class="log-panel">
  <div id="logsContent"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
