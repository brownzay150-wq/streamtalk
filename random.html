<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Talk</title>

<style>
body{
background:#0b0b14;
color:white;
font-family:sans-serif;
padding:20px;
margin:0;
}

a{
color:#7c3aed;
font-size:18px;
text-decoration:none;
}

h1{
background:linear-gradient(90deg,#7c3aed,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
font-size:38px;
margin:24px 0 10px;
}

.chatbox{
height:320px;
background:#111827;
border-radius:12px;
padding:12px;
overflow:auto;
margin-bottom:12px;
}

.message{
background:#1b2540;
padding:10px 12px;
border-radius:10px;
margin-bottom:8px;
word-break:break-word;
}

input{
width:100%;
box-sizing:border-box;
padding:14px;
border-radius:10px;
border:none;
background:#111827;
color:white;
margin-bottom:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:linear-gradient(90deg,#7c3aed,#ec4899);
color:white;
font-size:16px;
margin-bottom:10px;
}

.secondary{
background:#333;
}

.status{
color:#9ca3af;
margin-bottom:10px;
font-size:15px;
}

.error{
color:#ff6b6b;
margin-bottom:10px;
font-size:15px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<a href="index.html">← Back</a>

<h1>Random Talk</h1>

<div class="status" id="status">Connecting...</div>
<div class="error" id="error"></div>

<div id="chat" class="chatbox"></div>

<input id="messageInput" placeholder="Type a message..." />
<button id="sendBtn">Send</button>
<button id="reloadBtn" class="secondary">Reload Room</button>

<script>
const SUPABASE_URL = "https://hcefuiaealcgixftfric.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjZWZ1aWFlYWxjZ2l4ZnRmcmljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NDkwNjksImV4cCI6MjA4ODUyNTA2OX0.5A23xPBlvI9pd1z_xqQNQFMVZeeihp5KBhl3BK8IZrg";
const ROOM = "test_room";

const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const reloadBtn = document.getElementById("reloadBtn");

function setStatus(msg){
  statusEl.textContent = msg;
}

function setError(msg){
  errorEl.textContent = msg || "";
}

function clearError(){
  errorEl.textContent = "";
}

function renderMessages(rows){
  chatEl.innerHTML = "";
  rows.forEach(row => {
    const div = document.createElement("div");
    div.className = "message";
    div.textContent = row.message || "";
    chatEl.appendChild(div);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function supabaseGet(path){
  const res = await fetch(SUPABASE_URL + path, {
    method: "GET",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Accept": "application/json"
    }
  });

  const text = await res.text();
  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch(e){
    data = text;
  }

  if(!res.ok){
    throw new Error(typeof data === "string" ? data : JSON.stringify(data));
  }

  return data;
}

async function supabasePost(path, body){
  const res = await fetch(SUPABASE_URL + path, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    },
    body: JSON.stringify(body)
  });

  const text = await res.text();
  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch(e){
    data = text;
  }

  if(!res.ok){
    throw new Error(typeof data === "string" ? data : JSON.stringify(data));
  }

  return data;
}

async function loadMessages(){
  setStatus("Loading messages...");
  clearError();

  try{
    const rows = await supabaseGet(
      "/rest/v1/messages?select=id,message,room,created_at&room=eq." +
      encodeURIComponent(ROOM) +
      "&order=created_at.asc"
    );

    renderMessages(Array.isArray(rows) ? rows : []);
    setStatus("Connected");
  }catch(err){
    setError("Load failed: " + err.message);
    setStatus("Load failed");
  }
}

async function sendMessage(){
  const text = inputEl.value.trim();

  if(!text){
    setError("Type a message first");
    return;
  }

  setStatus("Sending...");
  clearError();
  sendBtn.disabled = true;

  try{
    await supabasePost("/rest/v1/messages", [
      {
        message: text,
        room: ROOM
      }
    ]);

    inputEl.value = "";
    await loadMessages();
  }catch(err){
    setError("Send failed: " + err.message);
    setStatus("Send failed");
  }

  sendBtn.disabled = false;
}

function start(){
  setStatus("Connecting...");
  loadMessages();
  setInterval(loadMessages, 2000);
}

sendBtn.addEventListener("click", sendMessage);
reloadBtn.addEventListener("click", loadMessages);
inputEl.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    sendMessage();
  }
});

start();
</script>

</body>
</html>
