<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamTalk</title>

<style>

body{
background:#0f0f14;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
font-size:40px;
background:linear-gradient(90deg,#7c3aed,#ec4899);
-webkit-background-clip:text;
color:transparent;
}

.tagline{
color:#aaa;
margin-bottom:30px;
}

.card{
background:#1c1f2e;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
background:linear-gradient(90deg,#7c3aed,#ec4899);
color:white;
margin-top:10px;
}

</style>

</head>

<body>

<h1>StreamTalk</h1>

<p class="tagline">Connect • Watch • Chat</p>

<div class="card">

<h2>Random Talk</h2>
<p>Jump into a random conversation instantly.</p>

<button>Start Chat</button>

</div>

<div class="card">

<h2>Watch Streams</h2>
<p>Watch live creators and join the chat.</p>

<button>Browse Streams</button>

</div>

<div class="card">

<h2>Communities</h2>
<p>Find people with the same interests.</p>

<button>Explore</button>

</div>

</body>

</html>
