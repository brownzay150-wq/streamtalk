<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk AI Chat</title>
<style>
body{margin:0;padding:16px;font-family:Arial;background:#0f0f14;color:white;}
.chat-box{background:#1c1f2e;border-radius:18px;padding:14px;min-height:50vh;max-width:600px;margin:auto;display:flex;flex-direction:column;gap:8px;}
textarea{flex:1;border:none;outline:none;border-radius:14px;padding:10px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:14px;padding:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;}
.bubble-wrap{display:flex;flex-direction:column;margin:6px 0;}
.bubble-wrap.me-wrap{align-items:flex-end;}
.bubble-wrap.other-wrap{align-items:flex-start;}
.message{padding:8px 12px;border-radius:14px;margin:2px 0;}
.me{background:#7c3aed;color:white;}
.other{background:#2a2f45;color:white;}
.system{text-align:center;color:#aaa;margin:6px 0;}
.actions{display:flex;gap:10px;margin-top:8px;}
.actions button{flex:1;}
footer{text-align:center;color:#aaa;font-size:13px;margin-top:20px;}
footer a{color:#aaa;text-decoration:none;margin:0 4px;}
</style>
</head>
<body>

<div class="chat-box">
  <div class="system">AI Chat Ready! Type below to start.</div>
  <div id="messages"></div>
  <textarea id="msg" placeholder="Type a message..." maxlength="500"></textarea>
  <div class="actions">
    <button id="send">Send</button>
    <button id="skip">Skip</button>
    <button id="clear">Clear</button>
  </div>
</div>

<footer>
  <a href="../rules.html" target="_blank">Rules</a>•
  <a href="../privacy.html" target="_blank">Privacy</a>•
  <a href="../terms.html" target="_blank">Terms</a>
</footer>

<script>
// Elements
const ms = document.getElementById("msg");
const msgs = document.getElementById("messages");
const send = document.getElementById("send");
const skip = document.getElementById("skip");
const clearBtn = document.getElementById("clear");

// Helpers
function addMsg(text,type){
  const w = document.createElement("div");
  w.className = "bubble-wrap " + (type==="me"?"me-wrap":"other-wrap");
  const b = document.createElement("div");
  b.className = "message "+type;
  b.textContent = text;
  w.appendChild(b);
  msgs.appendChild(w);
  msgs.scrollTop = msgs.scrollHeight;
}
function addSys(text){const d=document.createElement("div");d.className="system";d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}

// AI response (simple for testing)
async function aiRespond(text){
  return new Promise(res=>setTimeout(()=>res("AI: "+text.split("").reverse().join("")),500));
}

// Send message
send.addEventListener("click", async()=>{
  const t = ms.value.trim();
  if(!t) return;
  addMsg(t,"me");
  ms.value="";
  const r = await aiRespond(t);
  addMsg(r,"other");
});

// Enter key to send
ms.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send.click(); }
});

// Skip button
skip.addEventListener("click", ()=>{
  addSys("You skipped the AI chat.");
  msgs.innerHTML="";
});

// Clear button
clearBtn.addEventListener("click", ()=>{
  msgs.innerHTML="";
  addSys("Chat cleared.");
});
</script>

</body>
</html>
