<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTalk AI Test</title>
<style>
body{margin:0;padding:20px;font-family:Arial;background:#0f0f14;color:white;display:flex;flex-direction:column;gap:20px;}
h1{text-align:center;font-size:36px;background:linear-gradient(90deg,#7c3aed,#ec4899);-webkit-background-clip:text;color:transparent;}
.chat-box{background:#1c1f2e;padding:16px;border-radius:18px;max-width:500px;margin:auto;display:flex;flex-direction:column;gap:10px;}
.messages{flex:1;overflow-y:auto;max-height:50vh;padding:8px;display:flex;flex-direction:column;gap:6px;}
.message{padding:8px 12px;border-radius:14px;}
.me{background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;align-self:flex-end;}
.ai{background:#2a2f45;color:white;align-self:flex-start;}
textarea{border:none;outline:none;border-radius:14px;padding:10px;background:#2a2f45;color:white;resize:none;}
button{border:none;border-radius:14px;padding:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;cursor:pointer;}
.badge-wrap{margin-top:10px;text-align:center;}
footer{text-align:center;color:#aaa;margin-top:20px;font-size:13px;}
footer a{color:#08f;margin:0 5px;text-decoration:none;}
</style>
</head>
<body>

<h1>StreamTalk AI Chat</h1>

<div class="chat-box">
  <div class="messages" id="messages">
    <div class="ai">AI Chat Ready! Type below to start.</div>
  </div>
  <textarea id="msg" placeholder="Type a message..." maxlength="500"></textarea>
  <div style="display:flex;gap:10px;">
    <button id="send">Send</button>
    <button id="skip">Skip</button>
    <button id="clear">Clear</button>
  </div>
</div>

<div class="badge-wrap">AI Test Mode</div>

<footer>
  <a href="../rules.html" target="_blank">Rules</a> • 
  <a href="../privacy.html" target="_blank">Privacy</a> • 
  <a href="../terms.html" target="_blank">Terms</a>
</footer>

<script>
// Helper functions
const messages = document.getElementById("messages");
const msgInput = document.getElementById("msg");

function addMessage(text,type){
  const m = document.createElement("div");
  m.className = type;
  m.textContent = text;
  messages.appendChild(m);
  messages.scrollTop = messages.scrollHeight;
}

// Basic AI response logic
function getAIResponse(text){
  text = text.toLowerCase();
  // Greetings
  if(/hello|hi|hey/.test(text)) return "Hello! How's it going?";
  // Math
  const mathMatch = text.match(/(\d+)\s*(\+|\-|\*|x|\/)\s*(\d+)/);
  if(mathMatch){
    let a = parseFloat(mathMatch[1]);
    let op = mathMatch[2];
    let b = parseFloat(mathMatch[3]);
    let res;
    if(op==='+' ) res=a+b;
    else if(op==='-') res=a-b;
    else if(op==='*'||op==='x') res=a*b;
    else if(op==='/' ) res=a/b;
    return "Answer: "+res;
  }
  // Default
  return "Interesting! Tell me more.";
}

// Send button
document.getElementById("send").addEventListener("click",()=>{
  let t = msgInput.value.trim();
  if(!t) return;
  addMessage(t,"me");
  let reply = getAIResponse(t);
  setTimeout(()=>addMessage(reply,"ai"),300); // slight delay for realism
  msgInput.value="";
});

// Clear button
document.getElementById("clear").addEventListener("click",()=>{
  messages.innerHTML="";
  addMessage("AI Chat Ready! Type below to start.","ai");
});

// Skip button
document.getElementById("skip").addEventListener("click",()=>{
  addMessage("You skipped this conversation.","me");
  addMessage("AI is waiting for next message.","ai");
});

// Enter key
msgInput.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    document.getElementById("send").click();
  }
});
</script>

</body>
</html>
